version: 2

sources:
  - name: shopify
    description: Shopify e-commerce data
    database: "{{ var('tenant_db', env_var('TENANT_DB')) }}"
    schema: shopify
    tables:
      - name: orders
        columns:
          - name: order_id
            description: Unique ID for the order
          - name: customer_id
            description: Customer identifier for cross-platform joins

  - name: hubspot
    description: HubSpot CRM data
    database: "{{ var('tenant_db', env_var('TENANT_DB')) }}"
    schema: hubspot
    tables:
      - name: contacts
        columns:
          - name: contact_id
            description: HubSpot native contact ID
          - name: customer_id
            description: Customer identifier mapped to Shopify/Facebook for mart joins

  - name: facebook
    description: Facebook Ads data
    database: "{{ var('tenant_db', env_var('TENANT_DB')) }}"
    schema: facebook
    tables:
      - name: ads
        columns:
          - name: ad_id
            description: Facebook lead ID (for reference)
          - name: customer_id
            description: Customer identifier mapped to Shopify/HubSpot for mart joins
